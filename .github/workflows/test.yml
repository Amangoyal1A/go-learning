name: Go Code Review

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'  # Updated to avoid tool conflicts

      - name: Install Go Tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install github.com/kisielk/errcheck@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Run golangci-lint
        run: |
          ${HOME}/go/bin/golangci-lint run --out-format=colored-line-number ./...

      - name: Run errcheck
        run: |
          ${HOME}/go/bin/errcheck ./...

      - name: Run staticcheck
        run: |
          ${HOME}/go/bin/staticcheck ./...

      - name: Run gocyclo
        run: |
          ${HOME}/go/bin/gocyclo -over 10 .

      - name: Run goimports check
        run: |
          if [[ $(goimports -l .) ]]; then
            echo "Improper formatting, run 'goimports -w .'"
            exit 1
          fi

      - name: Summarize Findings
        run: |
          echo "Code Review Complete! Check logs for:"
          echo "- Linting (golangci-lint)"
          echo "- Unhandled errors (errcheck)"
          echo "- Static analysis (staticcheck)"
          echo "- Complexity (gocyclo)"
          echo "- Formatting (goimports)"